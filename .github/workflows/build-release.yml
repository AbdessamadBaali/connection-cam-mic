name: Build and Release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CamMicStreamer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamMicStreamer-Android-APK
          path: CamMicStreamer.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable executable
        working-directory: desktop
        run: npm run dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamMicViewer-Windows-EXE
          path: desktop/release/CamMicViewer.exe

  release:
    name: Publish latest release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "${{ github.repository }}" --cleanup-tag -y || true
          gh release create latest -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Cam Mic — latest builds" \
            --notes "Automatic build of the newest code. **CamMicStreamer.apk** goes on your Android phone, **CamMicViewer.exe** runs on your Windows PC. See the README for setup instructions." \
            files/CamMicStreamer.apk files/CamMicViewer.exe
